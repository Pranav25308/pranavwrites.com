version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
    build:
      commands:
        - env | grep -e MONGO_URL -e DB_NAME -e NEXTAUTH_SECRET -e ADMIN_USERNAME -e ADMIN_PASSWORD >> .env.production
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*